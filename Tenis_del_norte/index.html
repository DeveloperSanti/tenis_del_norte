<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Tenis del Norte — Tu tienda de tenis Nike, Adidas, Jordan, Puma y más. Envíos a todo Colombia."/>
  <title>Tenis del Norte · Tienda de Tenis</title>
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="styles/global.css"/>
  <link rel="stylesheet" href="styles/catalogo.css"/>
</head>
<body>

  <!-- nav.js inyecta el <nav> aquí automáticamente -->

  <!-- ══════════════════════════════════════
       HEADER
  ══════════════════════════════════════ -->
  <div class="catalog-header">
    <img src="assets/logo.png" alt="Tenis del Norte" class="catalog-logo"
         onerror="this.style.display='none'"/>
    <div class="section-label">Catálogo 2026</div>
    <h1 class="section-title">ENCUENTRA TU <span>PAR IDEAL</span></h1>
    <p class="catalog-subtitle">Nike · Adidas · Jordan · Puma y más. Entrega a todo Colombia.</p>
    <div class="gold-line"></div>
  </div>

  <!-- ══════════════════════════════════════
       TABS: Hombre / Mujer / Promos
  ══════════════════════════════════════ -->
  <div class="main-tabs">
    <button class="main-tab active" data-cat="hombre">
      <span class="tab-icon">👟</span><span>Hombre</span>
    </button>
    <button class="main-tab" data-cat="mujer">
      <span class="tab-icon">👠</span><span>Mujer</span>
    </button>
    <button class="main-tab tab-promo" data-cat="promo">
      <span class="tab-icon">⚡</span><span>Promos</span>
    </button>
  </div>

  <!-- ══════════════════════════════════════
       BARRA DE FILTROS (búsqueda + marca)
  ══════════════════════════════════════ -->
  <div class="filter-bar">

    <!-- Búsqueda de texto -->
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input
        type="text"
        id="catalogSearch"
        class="search-input"
        placeholder="Buscar por referencia o marca..."
        autocomplete="off"
      />
      <button class="search-clear hidden" id="searchClear" aria-label="Limpiar búsqueda">✕</button>
    </div>

    <!-- Dropdown de marcas -->
    <div class="brand-select-wrap">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
        <line x1="7" y1="7" x2="7.01" y2="7"/>
      </svg>
      <select id="brandSelect" class="brand-select">
        <option value="all">✦ Todas las marcas</option>
      </select>
      <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>

  </div>

  <div class="gold-divider" style="margin: 0 16px;"></div>

  <!-- ══════════════════════════════════════
       BARRA DE RESULTADOS
  ══════════════════════════════════════ -->
  <div class="results-bar">
    <span class="results-count" id="resultsCount"></span>
  </div>

  <!-- ══════════════════════════════════════
       GALERÍA
  ══════════════════════════════════════ -->
  <div class="gallery-grid" id="gallery">
    <div class="loader-wrap" id="loader">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Estado vacío -->
  <div class="empty-state hidden" id="emptyState">
    <span class="emoji">😕</span>
    <p>No hay tenis en esta categoría todavía.</p>
  </div>

  <!-- ══════════════════════════════════════
       CARGAR MÁS
  ══════════════════════════════════════ -->
  <!-- Sentinel para infinite scroll — invisible, solo detecta llegada al final -->
  <div id="infiniteSentinel" style="height:1px;"></div>
  <!-- Spinner de carga infinita -->
  <div class="load-more-wrap hidden" id="loadMoreWrap">
    <div class="infinite-spinner"><div class="spinner"></div></div>
  </div>

  <!-- ══════════════════════════════════════
       LIGHTBOX
  ══════════════════════════════════════ -->
  <div class="lightbox hidden" id="lightbox">
    <button class="lb-close" id="lbClose" title="Cerrar (Esc)">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" title="Anterior">‹</button>
    <button class="lb-nav lb-next" id="lbNext" title="Siguiente">›</button>

    <div class="lb-img-wrap" id="lbImgWrap">
      <img class="lb-img" id="lbImg" src="" alt=""/>
    </div>

    <div class="lb-counter" id="lbCounter"></div>

    <div class="lb-footer">
      <div class="lb-info">
        <div class="lb-marca"  id="lbMarca"></div>
        <div class="lb-ref"    id="lbRef"></div>
        <div id="lbPrice"></div>
        <div class="lb-badges" id="lbBadges"></div>
      </div>
      <a class="lb-wa-btn" id="lbWaBtn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
          <path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.116 1.523 5.847L.057 23.882l6.197-1.624A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.894a9.877 9.877 0 0 1-5.034-1.378l-.361-.214-3.735.979 1.004-3.642-.235-.374A9.855 9.855 0 0 1 2.106 12C2.106 6.53 6.53 2.106 12 2.106c5.469 0 9.894 4.424 9.894 9.894 0 5.469-4.425 9.894-9.894 9.894z"/>
        </svg>
        Lo quiero por WhatsApp
      </a>
    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
