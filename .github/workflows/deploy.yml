name: Deploy to Hostinger (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21

          # Carpeta local del sitio (con barra final, importante)
          local-dir: ./Tenis_del_norte/

          # Carpeta destino en el servidor (con barra final).
          # Hostinger: normalmente "public_html/" o la raíz "./" según la cuenta FTP.
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

          # Sincronización incremental: solo sube lo que cambió.
          # Lo que esté aquí NO se sube NI se borra del servidor.
          exclude: |
            **/.git*
            **/.git*/**
            api/config.php
            setup.sql
            migrate.sql
            uploads/
            uploads/**
