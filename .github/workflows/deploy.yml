name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy con rsync (con reintentos)
        run: |
          SSH_OPTS="ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4"

          n=0
          max=3
          until [ $n -ge $max ]; do
            n=$((n+1))
            echo "── Intento $n de $max ──"
            rsync -avz --delete \
              --timeout=120 \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='setup.sql' \
              --exclude='api/config.php' \
              --exclude='uploads/' \
              -e "$SSH_OPTS" \
              ./Tenis_del_norte/ \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/ \
            && echo "✅ Deploy exitoso" && exit 0

            echo "⚠️ Intento $n falló. Esperando antes de reintentar..."
            sleep $((n*20))
          done

          echo "❌ El deploy falló tras $max intentos."
          exit 1

      - name: Limpiar llave SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key